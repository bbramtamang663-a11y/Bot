
<!DOCTYPE html>
<html>
<head>
    <title>IP Logger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Loading...</h1>
    <script>
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;
                const url = 'https://script.google.com/macros/s/AKfycbwI2zQ6JdDnFNUa7L2EIDfB1Flnk4ayRzCLGgAJTh1sc98RU8j2do7RsP6qI2Bu2gL7mQ/exec?ip=' + encodeURIComponent(ip) + '&ua=' + encodeURIComponent(ua);
                fetch(url)
                    .then(() => {
                        document.body.innerHTML = '<h2>✅ Logged</h2><p>Your IP: ' + ip + '</p>';
                    })
                    .catch(() => {
                        document.body.innerHTML = '<h2>❌ Failed to log</h2><p>IP: ' + ip + '</p>';
                    });
            })
            .catch(() => {
                document.body.innerHTML = '<h2>❌ IP detect गर्न सकिएन</h2>';
            });
    </script>
</body>
</html>
